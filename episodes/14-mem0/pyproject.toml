# The dependencies this episode was measured on, and the Python it needs.
# `uv run` builds the environment from here and from uv.lock, so there is no
# install step and no venv to make by hand. uv.lock is committed on purpose:
# every score in this episode is a cosine similarity out of one embedding
# model, so the versions ARE the measurement. See PIN in src/mem.py.
[project]
name = "episode-14-mem0"
version = "0"
description = "Mem0 long-term memory, the code behind @fidetolabs reel #14"
requires-python = ">=3.13"
dependencies = [
    "fastembed==0.9.1",
    "mem0ai==2.2.1",
    "numpy==2.5.5",
    "pytest==9.2.0",
    "qdrant-client==1.20.0",
]

# NOT A PACKAGE. `run.py`, the two session modules and the tests put the episode
# folder on the path and import `src` from there. Building and installing a
# distribution called `src` would put a second copy on the path ahead of the one
# you are reading.
[tool.uv]
package = false
